<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Control Center</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Container to keep everything aligned */
        .dashboard-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Config Box */
        .config-box {
            background: #ffffff;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .config-box input {
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            flex: 1;
        }

        /* Balanced 2x2 Sensor Grid */
        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Remote Control Card */
        .control-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .control-card h3 {
            margin: 0 0 15px 0;
            color: #7f8c8d;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-off {
            background-color: #e74c3c;
        }

        .btn-off:hover {
            background-color: #c0392b;
        }

        @media (max-width: 500px) {
            .sensor-grid {
                grid-template-columns: 1fr;
            }
            .config-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <h1>🌐 IoT Dashboard</h1>

    <div class="dashboard-container">
        <!-- Configuration Card -->
        <div class="config-box">
            <input type="text" id="username" placeholder="Adafruit Username">
            <input type="password" id="aioKey" placeholder="Adafruit AIO Key">
            <button class="btn" onclick="saveCredentials()">Connect</button>
        </div>

        <!-- 2x2 Sensor Grid -->
        <div class="sensor-grid">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="tempVal">-- °C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humVal">-- %</div>
            </div>
            <div class="card">
                <h3>Light Level</h3>
                <div class="value" id="lightVal">--</div>
            </div>
            <div class="card">
                <h3>Motion Status</h3>
                <div class="value" id="motionVal">--</div>
            </div>
        </div>

        <!-- Remote Control Section -->
        <div class="control-card">
            <h3>Remote Control</h3>
            <button class="btn" id="lightBtn" onclick="toggleLight()">Turn LED ON</button>
        </div>
    </div>

    <script>
        let ledState = false;

        function saveCredentials() {
            fetchData();
            setInterval(fetchData, 3000);
        }

        async function getFeedValue(feedKey) {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const url = `https://io.adafruit.com/api/v2/${user}/feeds/${feedKey}/data/last`;
            
            try {
                const response = await fetch(url, { headers: { 'X-AIO-Key': key } });
                const data = await response.json();
                return data.value;
            } catch (err) {
                return '--';
            }
        }

        async function fetchData() {
            // Notice the "iot-adventure." added before the feed names!
            document.getElementById('tempVal').innerText = (await getFeedValue('iot-adventure.temperature')) + ' °C';
            document.getElementById('humVal').innerText = (await getFeedValue('iot-adventure.humidity')) + ' %';
            document.getElementById('lightVal').innerText = await getFeedValue('iot-adventure.light');
            
            const motion = await getFeedValue('iot-adventure.motion');
            document.getElementById('motionVal').innerText = motion == '1' ? '🚨 MOTION!' : 'Clear';
        }

        async function toggleLight() {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const btn = document.getElementById('lightBtn');
            
            ledState = !ledState;
            const payload = { value: ledState ? "1" : "0" };

            // We also updated the LED feed to live inside the iot-adventure group
            await fetch(`https://io.adafruit.com/api/v2/${user}/feeds/iot-adventure.led/data`, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (ledState) {
                btn.innerText = "Turn LED OFF";
                btn.classList.add('btn-off');
            } else {
                btn.innerText = "Turn LED ON";
                btn.classList.remove('btn-off');
            }
        }
    </script>
</body>
</html>
