<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico IoT Adventure Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --sidebar-bg: #0f172a;
            --sidebar-text: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* LEFT SIDEBAR: Config & Branding */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            margin: 0;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar p {
            margin: 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .config-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .config-form label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-weight: 600;
        }

        .config-form input {
            padding: 10px 12px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
            font-size: 0.9rem;
        }

        .config-form input:focus {
            border-color: var(--primary);
        }

        .btn-connect {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-connect:hover {
            background-color: var(--primary-hover);
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .top-bar {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        /* 2-COLUMN PANELS LAYOUT */
        .dashboard-panels {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; }
            .dashboard-panels { grid-template-columns: 1fr; }
        }

        /* PANEL 1: Sensor Readings Grid */
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .metric-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 130px;
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .metric-icon {
            font-size: 1.4rem;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
        }

        /* PANEL 2: Action Controls */
        .action-panel {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .action-panel h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .action-panel p {
            margin: 0 0 20px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            background: #fee2e2;
            color: var(--accent-red);
            margin-bottom: 20px;
            text-align: center;
        }

        .status-badge.active {
            background: #d1fae5;
            color: var(--accent-green);
        }

        .btn-toggle {
            width: 100%;
            background-color: var(--sidebar-bg);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-toggle.active {
            background-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <!-- Left Sidebar for Controls -->
    <div class="sidebar">
        <div>
            <h2>🌐 Pico IoT</h2>
            <p>Control Center v2.0</p>
        </div>

        <div class="config-form">
            <label>Adafruit Username</label>
            <input type="text" id="username" placeholder="e.g. student_pico">

            <label>Adafruit AIO Key</label>
            <input type="password" id="aioKey" placeholder="aio_xxxxxxxxxxxx">

            <button class="btn-connect" onclick="saveCredentials()">Connect Feed</button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="main-content">
        <div class="top-bar">
            <h1>Live Monitor</h1>
        </div>

        <div class="dashboard-panels">
            <!-- Left Side: Sensor Quadrant -->
            <div class="sensor-grid">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Temperature</span>
                        <span class="metric-icon">🌡️</span>
                    </div>
                    <div class="metric-value" id="tempVal">-- °C</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Humidity</span>
                        <span class="metric-icon">💧</span>
                    </div>
                    <div class="metric-value" id="humVal">-- %</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Light Level</span>
                        <span class="metric-icon">☀️</span>
                    </div>
                    <div class="metric-value" id="lightVal">--</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-title">Motion Sensor</span>
                        <span class="metric-icon">🏃</span>
                    </div>
                    <div class="metric-value" id="motionVal">--</div>
                </div>
            </div>

            <!-- Right Side: Actuator Control -->
            <div class="action-panel">
                <div>
                    <h3>💡 LED Control</h3>
                    <p>Trigger physical hardware outputs remotely from this browser dashboard.</p>
                    <div class="status-badge" id="ledBadge">OFFLINE / OFF</div>
                </div>
                <button class="btn-toggle" id="lightBtn" onclick="toggleLight()">Turn LED ON</button>
            </div>
        </div>
    </div>

    <script>
        let ledState = false;

        function saveCredentials() {
            fetchData();
            setInterval(fetchData, 3000);
        }

        async function getFeedValue(feedKey) {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const url = `https://io.adafruit.com/api/v2/${user}/feeds/${feedKey}/data/last`;
            
            try {
                const response = await fetch(url, { headers: { 'X-AIO-Key': key } });
                const data = await response.json();
                return data.value;
            } catch (err) {
                return '--';
            }
        }

        async function fetchData() {
            document.getElementById('tempVal').innerText = (await getFeedValue('temperature')) + ' °C';
            document.getElementById('humVal').innerText = (await getFeedValue('humidity')) + ' %';
            document.getElementById('lightVal').innerText = await getFeedValue('light');
            
            const motion = await getFeedValue('motion');
            document.getElementById('motionVal').innerText = motion == '1' ? '🚨 Motion' : 'Clear';
        }

        async function toggleLight() {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const btn = document.getElementById('lightBtn');
            const badge = document.getElementById('ledBadge');
            
            ledState = !ledState;
            const payload = { value: ledState ? "1" : "0" };

            await fetch(`https://io.adafruit.com/api/v2/${user}/feeds/led/data`, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (ledState) {
                btn.innerText = "Turn LED OFF";
                btn.classList.add('active');
                badge.innerText = "LED ONLINE / ON";
                badge.classList.add('active');
            } else {
                btn.innerText = "Turn LED ON";
                btn.classList.remove('active');
                badge.innerText = "OFFLINE / OFF";
                badge.classList.remove('active');
            }
        }
    </script>
</body>
</html>
