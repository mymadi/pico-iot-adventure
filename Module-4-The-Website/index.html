<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Control Center</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #2c3e50; margin-bottom: 20px; }

        .dashboard-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-box {
            background: #ffffff;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .config-box input {
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            flex: 1;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #2c3e50;
        }

        .control-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .control-card h3 {
            margin: 0 0 15px 0;
            color: #7f8c8d;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background-color: #2980b9; }

        .btn-off { background-color: #e74c3c; }
        .btn-off:hover { background-color: #c0392b; }

        @media (max-width: 500px) {
            .sensor-grid { grid-template-columns: 1fr; }
            .config-box { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>🌐 IoT Dashboard</h1>

    <div class="dashboard-container">
        <!-- Configuration Card -->
        <div class="config-box">
            <input type="text" id="username" placeholder="Adafruit Username">
            <input type="password" id="aioKey" placeholder="Adafruit AIO Key">
            <!-- We gave this button an ID so we can change it to "Disconnect" -->
            <button class="btn" id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>

        <!-- 2x2 Sensor Grid -->
        <div class="sensor-grid">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="tempVal">-- °C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humVal">-- %</div>
            </div>
            <div class="card">
                <h3>Light Level</h3>
                <div class="value" id="lightVal">--</div>
            </div>
            <div class="card">
                <h3>Motion Status</h3>
                <div class="value" id="motionVal">--</div>
            </div>
        </div>

        <!-- Remote Control Section -->
        <div class="control-card">
            <h3>Remote Control</h3>
            <button class="btn" id="lightBtn" onclick="toggleLight()">Turn LED ON</button>
        </div>
    </div>

    <script>
        let ledState = false;
        
        // We added these to keep track of our connection!
        let isConnected = false;
        let timerID = null;

        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;

            // Make sure the student actually typed their passwords!
            if (!user || !key) {
                alert("Hold on Hacker! Please enter your Username and Key first!");
                return;
            }

            if (isConnected === false) {
                // 🟢 CONNECTING 🟢
                isConnected = true;
                btn.innerText = "Disconnect";
                btn.classList.add('btn-off'); // Turns the button red
                
                fetchData(); // Fetch once immediately
                timerID = setInterval(fetchData, 3000); // Start the 3-second timer
            } else {
                // 🔴 DISCONNECTING 🔴
                isConnected = false;
                btn.innerText = "Connect";
                btn.classList.remove('btn-off'); // Turns the button blue again
                
                clearInterval(timerID); // Stop the timer!

                // Erase the screen data
                document.getElementById('tempVal').innerText = '-- °C';
                document.getElementById('humVal').innerText = '-- %';
                document.getElementById('lightVal').innerText = '--';
                document.getElementById('motionVal').innerText = '--';
            }
        }

        async function getFeedValue(feedKey) {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const url = `https://io.adafruit.com/api/v2/${user}/feeds/${feedKey}/data/last`;
            
            try {
                const response = await fetch(url, { headers: { 'X-AIO-Key': key } });
                const data = await response.json();
                return data.value;
            } catch (err) {
                return '--';
            }
        }

        async function fetchData() {
            // 1. Fetch all the data from Adafruit IO first
            const temp = await getFeedValue('iot-adventure.temperature');
            const hum = await getFeedValue('iot-adventure.humidity');
            const light = await getFeedValue('iot-adventure.light');
            const motion = await getFeedValue('iot-adventure.motion');

            // 2. Round the numbers to 1 decimal place (if the data is not '--')
            if (temp !== '--') {
                document.getElementById('tempVal').innerText = parseFloat(temp).toFixed(1) + ' °C';
            }
            
            if (hum !== '--') {
                document.getElementById('humVal').innerText = parseFloat(hum).toFixed(1) + ' %';
            }
            
            if (light !== '--') {
                document.getElementById('lightVal').innerText = parseFloat(light).toFixed(1) + ' %';
            }
            
            // 3. Update the motion status
            document.getElementById('motionVal').innerText = motion == '1' ? '🚨 MOTION!' : 'Clear';
        }

        async function toggleLight() {
            const user = document.getElementById('username').value;
            const key = document.getElementById('aioKey').value;
            const btn = document.getElementById('lightBtn');
            
            ledState = !ledState;
            const payload = { value: ledState ? "1" : "0" };

            await fetch(`https://io.adafruit.com/api/v2/${user}/feeds/iot-adventure.led/data`, {
                method: 'POST',
                headers: {
                    'X-AIO-Key': key,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (ledState) {
                btn.innerText = "Turn LED OFF";
                btn.classList.add('btn-off');
            } else {
                btn.innerText = "Turn LED ON";
                btn.classList.remove('btn-off');
            }
        }
    </script>
</body>
</html>
