<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Control Center</title>
    <!-- 🚀 Paho MQTT Library for WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #2c3e50; margin-bottom: 20px; }

        .dashboard-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-box {
            background: #ffffff;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .config-box input, .config-box select {
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            flex: 1;
            min-width: 130px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #2c3e50;
        }

        .control-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .control-card h3 {
            margin: 0 0 15px 0;
            color: #7f8c8d;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background-color: #2980b9; }

        .btn-off { background-color: #e74c3c; }
        .btn-off:hover { background-color: #c0392b; }

        @media (max-width: 500px) {
            .sensor-grid { grid-template-columns: 1fr; }
            .config-box { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>🌐 IoT Dashboard</h1>

    <div class="dashboard-container">
        <!-- Configuration Card for Local Broker -->
        <div class="config-box">
            <input type="text" id="brokerIp" placeholder="Teacher PC IP (e.g. 192.168.1.100)">
            <select id="groupSelect">
                <option value="group01">Group 01</option>
                <option value="group02">Group 02</option>
                <option value="group03">Group 03</option>
                <option value="group04">Group 04</option>
                <option value="group05">Group 05</option>
                <option value="group06">Group 06</option>
                <option value="group07">Group 07</option>
                <option value="group08">Group 08</option>
                <option value="group09">Group 09</option>
                <option value="group10">Group 10</option>
            </select>
            <button class="btn" id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>

        <!-- 2x2 Sensor Grid -->
        <div class="sensor-grid">
            <div class="card">
                <h3>Temperature</h3>
                <div class="value" id="tempVal">-- °C</div>
            </div>
            <div class="card">
                <h3>Humidity</h3>
                <div class="value" id="humVal">-- %</div>
            </div>
            <div class="card">
                <h3>Light Level</h3>
                <div class="value" id="lightVal">--</div>
            </div>
            <div class="card">
                <h3>Motion Status</h3>
                <div class="value" id="motionVal">--</div>
            </div>
        </div>

        <!-- Remote Control Section -->
        <div class="control-card">
            <h3>Remote Control</h3>
            <button class="btn" id="lightBtn" onclick="toggleLight()">Turn LED ON</button>
        </div>
    </div>

    <script>
        let client = null;
        let isConnected = false;
        let ledState = false;
        let activeGroup = "group01";

        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const ip = document.getElementById('brokerIp').value.trim();
            activeGroup = document.getElementById('groupSelect').value;

            if (!ip) {
                alert("Hold on Hacker! Please enter the Teacher PC IP Address first!");
                return;
            }

            if (!isConnected) {
                // Generate a random Client ID to prevent conflicts
                const clientId = "web_simple_" + Math.random().toString(16).substr(2, 8);
                
                // Connect via WebSocket port 9001
                client = new Paho.MQTT.Client(ip, 9001, clientId);

                client.onConnectionLost = onConnectionLost;
                client.onMessageArrived = onMessageArrived;

                client.connect({
                    onSuccess: () => {
                        isConnected = true;
                        btn.innerText = "Disconnect";
                        btn.classList.add('btn-off');

                        // Subscribe to topics for the selected group
                        client.subscribe(activeGroup + "/temperature");
                        client.subscribe(activeGroup + "/humidity");
                        client.subscribe(activeGroup + "/light");
                        client.subscribe(activeGroup + "/motion");
                    },
                    onFailure: (err) => {
                        alert("Connection failed! Make sure Mosquitto is running on " + ip + ":9001");
                        console.error(err);
                    }
                });
            } else {
                if (client) client.disconnect();
                resetUI();
            }
        }

        function onConnectionLost(responseObject) {
            resetUI();
        }

        function resetUI() {
            isConnected = false;
            const btn = document.getElementById('connectBtn');
            btn.innerText = "Connect";
            btn.classList.remove('btn-off');

            // Reset values on screen
            document.getElementById('tempVal').innerText = '-- °C';
            document.getElementById('humVal').innerText = '-- %';
            document.getElementById('lightVal').innerText = '--';
            document.getElementById('motionVal').innerText = '--';
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            if (topic.endsWith("/temperature")) {
                document.getElementById('tempVal').innerText = payload + ' °C';
            } else if (topic.endsWith("/humidity")) {
                document.getElementById('humVal').innerText = payload + ' %';
            } else if (topic.endsWith("/light")) {
                document.getElementById('lightVal').innerText = payload;
            } else if (topic.endsWith("/motion")) {
                document.getElementById('motionVal').innerText = payload === '1' ? '🚨 MOTION!' : 'Clear';
            }
        }

        function toggleLight() {
            if (!isConnected || !client) {
                alert("Please connect to Mosquitto first!");
                return;
            }

            const btn = document.getElementById('lightBtn');
            ledState = !ledState;
            
            const message = new Paho.MQTT.Message(ledState ? "1" : "0");
            message.destinationName = activeGroup + "/led";
            client.send(message);

            if (ledState) {
                btn.innerText = "Turn LED OFF";
                btn.classList.add('btn-off');
            } else {
                btn.innerText = "Turn LED ON";
                btn.classList.remove('btn-off');
            }
        }
    </script>
</body>
</html>
