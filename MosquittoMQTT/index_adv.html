<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Control Center</title>
    <!-- 🚀 Chart.js for Graphs/Gauges & Paho MQTT for Local WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            color: #2c3e50; 
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .config-box {
            background: #ffffff;
            padding: 18px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .config-box input, .config-box select {
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            flex: 1;
            min-width: 130px;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .card-header h3 {
            margin: 0;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .icon {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            stroke: #3498db;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.5s;
        }

        .value {
            font-size: 2.2em;
            font-weight: bold;
            color: #2c3e50;
            transition: color 0.5s;
        }

        /* 🔋 CSS For Light Power Bar */
        .power-bar-bg {
            width: 100%;
            height: 15px;
            background-color: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .power-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #f1c40f;
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }

        /* 🚨 CSS For Motion Radar Dot */
        .radar-dot {
            width: 24px;
            height: 24px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin: 10px auto;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
            transition: all 0.3s;
        }

        .intruder-alert {
            background-color: #e74c3c;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.8);
            animation: pulse-red 0.8s infinite alternate;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            100% { transform: scale(1.4); }
        }

        .chart-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 100%;
        }

        .gauge-container {
            width: 130px; 
            position: relative;
            margin-bottom: 10px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background-color: #2980b9; }
        .btn-off { background-color: #e74c3c; }
        .btn-off:hover { background-color: #c0392b; }

        @media (max-width: 500px) {
            .sensor-grid { grid-template-columns: 1fr; }
            .config-box { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>
        <!-- 🖥️ Microchip Icon -->
        <svg class="icon" style="stroke: #2c3e50; width: 36px; height: 36px;" viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
            <line x1="9" y1="1" x2="9" y2="4"></line>
            <line x1="15" y1="1" x2="15" y2="4"></line>
            <line x1="9" y1="20" x2="9" y2="23"></line>
            <line x1="15" y1="20" x2="15" y2="23"></line>
            <line x1="20" y1="9" x2="23" y2="9"></line>
            <line x1="20" y1="14" x2="23" y2="14"></line>
            <line x1="1" y1="9" x2="4" y2="9"></line>
            <line x1="1" y1="14" x2="4" y2="14"></line>
        </svg>
        IoT Control Center
    </h1>

    <div class="dashboard-container">
        <!-- Local Mosquitto Configuration Card -->
        <div class="config-box">
            <input type="text" id="brokerIp" placeholder="Teacher PC IP (e.g. 192.168.1.100)">
            <select id="groupSelect">
                <option value="group01">Group 01</option>
                <option value="group02">Group 02</option>
                <option value="group03">Group 03</option>
                <option value="group04">Group 04</option>
                <option value="group05">Group 05</option>
                <option value="group06">Group 06</option>
                <option value="group07">Group 07</option>
                <option value="group08">Group 08</option>
                <option value="group09">Group 09</option>
                <option value="group10">Group 10</option>
            </select>
            <button class="btn" id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>

        <!-- 2x2 Sensor Grid -->
        <div class="sensor-grid">
            
            <!-- Temperature -->
            <div class="card">
                <div class="card-header">
                    <svg class="icon" id="tempIcon" viewBox="0 0 24 24"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
                    <h3>Temperature</h3>
                </div>
                <div class="value" id="tempVal">-- °C</div>
            </div>
            
            <!-- Humidity -->
            <div class="card">
                <div class="card-header">
                    <svg class="icon" id="humIcon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    <h3>Humidity</h3>
                </div>
                <div class="gauge-container">
                    <canvas id="humGauge"></canvas>
                </div>
                <div class="value" id="humVal" style="font-size: 1.5em; margin-top: -10px;">-- %</div>
            </div>
            
            <!-- Light Level -->
            <div class="card">
                <div class="card-header">
                    <svg class="icon" id="lightIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <h3>Light Level</h3>
                </div>
                <div class="power-bar-bg">
                    <div class="power-bar-fill" id="lightBar"></div>
                </div>
                <div class="value" id="lightVal" style="font-size: 1.5em;">--</div>
            </div>
            
            <!-- Motion Status -->
            <div class="card">
                <div class="card-header">
                    <svg class="icon" id="motionIcon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    <h3>Motion Status</h3>
                </div>
                <div class="radar-dot" id="motionDot"></div>
                <div class="value" id="motionVal" style="font-size: 1.5em;">--</div>
            </div>
        </div>

        <!-- 📈 LIVE TEMPERATURE GRAPH -->
        <div class="chart-card">
            <div class="card-header" style="justify-content: center;">
                <svg class="icon" viewBox="0 0 24 24" style="stroke: #7f8c8d;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <h3 style="margin: 0; color: #7f8c8d;">Live Temperature Trend</h3>
            </div>
            <canvas id="tempChart"></canvas>
        </div>

        <!-- Remote Control Section -->
        <div class="card">
            <div class="card-header" style="justify-content: center;">
                <svg class="icon" viewBox="0 0 24 24" style="stroke: #7f8c8d;"><path d="M9 18h6M10 22h4M15.09 14c.18-.98.65-1.74 1.41-2.5A6 6 0 1 0 7.5 11.5c.76.76 1.23 1.52 1.41 2.5h6.18z"/></svg>
                <h3 style="margin: 0; color: #7f8c8d;">Remote Control</h3>
            </div>
            <button class="btn" id="lightBtn" style="width: 100%; max-width: 300px;" onclick="toggleLight()">Turn LED ON</button>
        </div>
    </div>

    <script>
        let client = null;
        let isConnected = false;
        let ledState = false;
        let activeGroup = "group01";

        // 📈 Line Graph Setup
        const tempCtx = document.getElementById('tempChart').getContext('2d');
        let tempChart = new Chart(tempCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Temp (°C)', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52, 152, 219, 0.1)', borderWidth: 3, fill: true, tension: 0.4 }] },
            options: { responsive: true, scales: { x: { grid: { display: false } }, y: { beginAtZero: false } }, plugins: { legend: { display: false } } }
        });

        // ⏱️ Humidity Gauge Setup
        const humCtx = document.getElementById('humGauge').getContext('2d');
        let humGauge = new Chart(humCtx, {
            type: 'doughnut',
            data: { labels: ['Humidity', 'Empty'], datasets: [{ data: [0, 100], backgroundColor: ['#3498db', '#ecf0f1'], borderWidth: 0 }] },
            options: { circumference: 180, rotation: 270, cutout: '75%', responsive: true, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
        });

        function toggleConnection() {
            const btn = document.getElementById('connectBtn');
            const ip = document.getElementById('brokerIp').value.trim();
            activeGroup = document.getElementById('groupSelect').value;

            if (!ip) {
                alert("Please enter the Teacher PC IP Address!");
                return;
            }

            if (!isConnected) {
                const clientId = "web_advanced_" + Math.random().toString(16).substr(2, 8);
                // Connect via WebSocket port 9001
                client = new Paho.MQTT.Client(ip, 9001, clientId);

                client.onConnectionLost = onConnectionLost;
                client.onMessageArrived = onMessageArrived;

                client.connect({
                    onSuccess: () => {
                        isConnected = true;
                        btn.innerText = "Disconnect";
                        btn.classList.add('btn-off');

                        // Reset temperature graph data on new connection
                        tempChart.data.labels = [];
                        tempChart.data.datasets[0].data = [];
                        tempChart.update();

                        // Subscribe to selected group topics
                        client.subscribe(activeGroup + "/temperature");
                        client.subscribe(activeGroup + "/humidity");
                        client.subscribe(activeGroup + "/light");
                        client.subscribe(activeGroup + "/motion");
                    },
                    onFailure: (err) => {
                        alert("Connection failed! Make sure Mosquitto is running on " + ip + ":9001");
                        console.error(err);
                    }
                });
            } else {
                if (client) client.disconnect();
                resetDashboardUI();
            }
        }

        function onConnectionLost(responseObject) {
            resetDashboardUI();
        }

        function resetDashboardUI() {
            isConnected = false;
            const btn = document.getElementById('connectBtn');
            btn.innerText = "Connect";
            btn.classList.remove('btn-off');

            document.getElementById('tempVal').innerText = '-- °C';
            document.getElementById('tempVal').style.color = '#2c3e50';
            document.getElementById('tempIcon').style.stroke = '#3498db';

            document.getElementById('humVal').innerText = '-- %';
            document.getElementById('lightVal').innerText = '--';
            document.getElementById('motionVal').innerText = '--';
            document.getElementById('lightBar').style.width = '0%';
            
            const dot = document.getElementById('motionDot');
            dot.className = 'radar-dot';
            dot.style.backgroundColor = '#2ecc71';
            document.getElementById('motionVal').style.color = '#2c3e50';
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;

            // 🌡️ Temperature
            if (topic.endsWith("/temperature")) {
                const tempNum = parseFloat(payload);
                document.getElementById('tempVal').innerText = tempNum + ' °C';
                
                let tempColor = '#3498db';
                if (tempNum > 30) tempColor = '#e74c3c';
                else if (tempNum >= 22) tempColor = '#2ecc71';

                document.getElementById('tempVal').style.color = tempColor;
                document.getElementById('tempIcon').style.stroke = tempColor;

                const now = new Date();
                const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
                
                tempChart.data.labels.push(timeStr);
                tempChart.data.datasets[0].data.push(tempNum);
                tempChart.data.datasets[0].borderColor = tempColor;
                
                if (tempChart.data.labels.length > 40) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                tempChart.update();
            }

            // 💧 Humidity
            if (topic.endsWith("/humidity")) {
                const humNum = parseFloat(payload);
                document.getElementById('humVal').innerText = humNum + ' %';
                
                let humColor = '#3498db';
                if (humNum > 70) humColor = '#8e44ad';
                else if (humNum < 40) humColor = '#f1c40f';

                document.getElementById('humIcon').style.stroke = humColor;
                humGauge.data.datasets[0].data = [humNum, 100 - humNum];
                humGauge.data.datasets[0].backgroundColor[0] = humColor;
                humGauge.update();
            }

            // ☀️ Light
            if (topic.endsWith("/light")) {
                document.getElementById('lightVal').innerText = payload;
                const lightPercent = Math.min((parseFloat(payload) / 65535) * 100, 100);
                
                let lightColor = '#f1c40f';
                if (lightPercent < 30) lightColor = '#7f8c8d';
                else if (lightPercent > 80) lightColor = '#e67e22';

                const bar = document.getElementById('lightBar');
                bar.style.width = lightPercent + '%';
                bar.style.backgroundColor = lightColor;
                document.getElementById('lightIcon').style.stroke = lightColor;
            }

            // 🚨 Motion
            if (topic.endsWith("/motion")) {
                const dot = document.getElementById('motionDot');
                const motionText = document.getElementById('motionVal');
                const motionIcon = document.getElementById('motionIcon');

                if (payload === "1") {
                    motionText.innerText = '🚨 MOTION!';
                    motionText.style.color = '#e74c3c';
                    motionIcon.style.stroke = '#e74c3c';
                    dot.style.backgroundColor = '#e74c3c';
                    dot.classList.add('intruder-alert');
                } else {
                    motionText.innerText = 'Clear';
                    motionText.style.color = '#2ecc71';
                    motionIcon.style.stroke = '#2ecc71';
                    dot.style.backgroundColor = '#2ecc71';
                    dot.classList.remove('intruder-alert');
                }
            }
        }

        function toggleLight() {
            if (!isConnected || !client) {
                alert("Please connect to Mosquitto first!");
                return;
            }

            const btn = document.getElementById('lightBtn');
            ledState = !ledState;
            
            const message = new Paho.MQTT.Message(ledState ? "1" : "0");
            message.destinationName = activeGroup + "/led";
            client.send(message);

            if (ledState) {
                btn.innerText = "Turn LED OFF";
                btn.classList.add('btn-off');
            } else {
                btn.innerText = "Turn LED ON";
                btn.classList.remove('btn-off');
            }
        }
    </script>
</body>
</html>
